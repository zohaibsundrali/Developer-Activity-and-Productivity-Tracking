plugins { id 'com.android.application' }
android {
    namespace 'com.devtrack.field'
    compileSdk 36
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId 'com.devtrack.field'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix ".debug" }; release { minifyEnabled false } }
}
dependencies { androidTestImplementation 'androidx.test:runner:1.7.0'; androidTestImplementation 'androidx.test.ext:junit:1.3.0'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20250517' }
