name: Android field tracking
on:
  pull_request:
    paths: ['mobile/android/**', '.github/workflows/android-field.yml']
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android-field.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-field-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and unit tests
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Foreground lifecycle on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
      - name: APK checksum
        working-directory: mobile/android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devtrack-field-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/
            mobile/android/app/build/reports/
          retention-days: 14
